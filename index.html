<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="profile-card">
    <!-- Header Banner -->
    <div class="cover-image" id="coverDisplay">
      <label class="cover-upload-btn">
        📷 Change Cover
        <input type="file" id="coverInput" accept="image/*" hidden>
      </label>
    </div>

    <!-- Main Profile Content -->
    <div class="profile-header">
      <div class="avatar-container">
        <img src="https://via.placeholder.com/120" id="avatarDisplay" alt="User Avatar">
        <label class="avatar-upload-btn" title="Change Avatar">
          ✎
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </label>
      </div>

      <div class="header-actions">
        <button class="btn btn-primary" id="editProfileBtn">Edit Profile</button>
      </div>
    </div>

    <!-- User Information Display -->
    <div class="profile-info" id="viewMode">
      <h2 id="nameDisplay">Hridoy</h2>
      <p class="username" id="handleDisplay">@hridoy_dev</p>
      <p class="bio" id="bioDisplay">Gaming content creator and web developer. Building cool interactive projects!</p>
      
      <div class="stats-row">
        <div class="stat"><strong id="postsCount">24</strong><span>Posts</span></div>
        <div class="stat"><strong id="followersCount">1.2k</strong><span>Followers</span></div>
        <div class="stat"><strong id="followingCount">450</strong><span>Following</span></div>
      </div>

      <div class="badges" id="badgesDisplay">
        <span class="badge">Gamer</span>
        <span class="badge">Developer</span>
        <span class="badge">Creator</span>
      </div>
    </div>

    <!-- Edit Form (Hidden by default) -->
    <form class="edit-form" id="editMode" style="display: none;">
      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="nameInput" maxlength="30" required>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="handleInput" maxlength="20" required>
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea id="bioInput" rows="3" maxlength="150"></textarea>
        <span class="char-counter"><span id="charCount">0</span>/150</span>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>

    <!-- Navigation Tabs -->
    <div class="profile-tabs">
      <button class="tab-btn active" onclick="switchTab('posts')">Posts</button>
      <button class="tab-btn" onclick="switchTab('activity')">Activity</button>
      <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
    </div>

    <div class="tab-content">
      <div id="postsTab" class="tab-pane active">
        <p>No recent posts to show.</p>
      </div>
      <div id="activityTab" class="tab-pane" style="display: none;">
        <p>Recent Activity: Joined the platform recently.</p>
      </div>
      <div id="settingsTab" class="tab-pane" style="display: none;">
        <p>Account Preferences and Privacy Settings.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
